name: Spring Service
run-name: Deploy ${{ github.ref_name }} to ${{ github.event.inputs.environment || 'test' }}

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        default: test
      action:
        description: "Choose what to do"
        required: true
        type: choice
        options:
          - build-only
          - build-and-deploy
        default: build-and-deploy

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: [self-hosted]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: apps/spring-service
        run: chmod +x gradlew

      - name: Run tests
        working-directory: apps/spring-service
        run: ./gradlew test

  build-docker:
    name: Build Docker Image
    runs-on: [self-hosted]
    needs: run-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build
        working-directory: apps/spring-service
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Building version: $VERSION"
          docker build -t spring-service:${VERSION} .

      - name: Clean old Docker images
        run: |
          docker image prune -f --filter "dangling=true"

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'test' }}
    runs-on: [self-hosted]
    needs: [run-tests, build-docker]
    environment: ${{ github.event.inputs.environment || 'test' }}
    if: ${{ github.event.inputs.action != 'build-only' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop existing container
        working-directory: apps/spring-service
        run: |
          docker compose stop spring-service || true
          docker compose rm -f spring-service || true

      - name: Deploy with Docker Compose
        working-directory: apps/spring-service
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'test' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Deploying version '$VERSION' to environment '$ENVIRONMENT'"
          echo "Commit sha '${COMMIT}'"
          docker compose up -d spring-service

      - name: Verify deployment
        run: |
          sleep 5
          docker ps | grep spring-service || exit 1
          echo "✅ Deployment successful"